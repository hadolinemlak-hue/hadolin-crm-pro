<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yerel Fotoğraf Galerisi</title>

    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Fotoğraflar yalnızca cihazınızda saklanır.">
</head>
<body>

    <div class="container">

        <header class="header">
            <h1>📸 Yerel Fotoğraf Galerisi</h1>
            <p>Fotoğraflar yalnızca cihazınızda saklanır</p>
        </header>

        <section class="upload-box">
            <label for="photoInput" class="upload-btn">
                Fotoğraf Seç
            </label>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
                multiple
            >
        </section>

        <div
            id="loading"
            class="loader"
            style="display:none;"
        ></div>

        <div
            id="emptyState"
            class="empty-state"
        >
            <h2>Henüz fotoğraf yok</h2>
            <p>İlk fotoğrafınızı yükleyin.</p>
        </div>

        <section
            id="gallery"
            class="gallery"
        >
        </section>

    </div>

    <template id="photoTemplate">
        <div class="photo-card">

            <button class="delete-btn">
                ×
            </button>

            <img
                src=""
                alt="Fotoğraf"
                loading="lazy"
            >

        </div>
    </template>

    <script src="app.js"></script>

</body>
</html>
