<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>İlan CRM</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2>CRM</h2>
  <nav class="nav">
    <a href="#">İlanlar</a>
    <a href="#">Müşteriler</a>
  </nav>
</aside>

<!-- MAIN -->
<main class="main">

  <header class="topbar">
    <h3>İlanlar</h3>
    <input id="search" class="search" placeholder="Ara..." />
  </header>

  <section class="content">

    <!-- LISTINGS -->
    <div id="listings" class="grid"></div>

    <div id="pagination" class="pagination"></div>

    <!-- CUSTOMERS -->
    <h3 style="margin-top:40px;">Müşteriler</h3>

    <div class="table">
      <table>
        <thead>
          <tr>
            <th>İsim</th>
            <th>Telefon</th>
            <th>İşlem</th>
          </tr>
        </thead>
        <tbody id="customers"></tbody>
      </table>
    </div>

  </section>

</main>

<script src="app.js"></script>
</body>
</html>
