```html
<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>HADOLİN REAL ESTATE CRM</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- CSS FILES -->
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />

</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="logo">
                <i class="fa-solid fa-building"></i>
                <span>HADOLİN CRM</span>
            </div>

            <button class="sidebar-toggle">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <nav class="sidebar-nav">

            <ul>

                <li>
                    <a href="#" class="nav-item active">
                        <i class="fa-solid fa-chart-line"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="#" class="nav-item">
                        <i class="fa-solid fa-building"></i>
                        Portföyler
                    </a>
                </li>

                <li>
                    <a href="#" class="nav-item">
                        <i class="fa-solid fa-users"></i>
                        Müşteriler
                    </a>
                </li>

                <li>
                    <a href="#" class="nav-item">
                        <i class="fa-solid fa-handshake"></i>
                        Eşleştirme
                    </a>
                </li>

            </ul>

        </nav>

        <div class="sidebar-footer">

            <div class="user-info">

                <div class="user-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>
                    <div class="user-name">
                        Emlak Danışmanı
                    </div>

                    <div class="user-role">
                        Yönetici
                    </div>
                </div>

            </div>

        </div>

    </aside>

    <!-- SIDEBAR OVERLAY -->
    <div class="sidebar-overlay"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">

            <div class="topbar-left">

                <button class="mobile-menu-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <h1 class="page-title">
                    Dashboard
                </h1>

            </div>

            <div class="topbar-right">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        placeholder="Ara..."
                    />

                </div>

                <button class="notification-btn">

                    <i class="fa-solid fa-bell"></i>

                    <span class="badge">
                        0
                    </span>

                </button>

            </div>

        </header>

        <!-- PAGE CONTENT -->
        <div class="page-content">

            <!-- STATS -->
            <section class="stats-grid">

                <div class="stat-card blue">

                    <div class="stat-icon">
                        <i class="fa-solid fa-house"></i>
                    </div>

                    <div>

                        <div class="stat-value" id="portfolioCount">
                            0
                        </div>

                        <div class="stat-label">
                            Toplam Portföy
                        </div>

                    </div>

                </div>

                <div class="stat-card green">

                    <div class="stat-icon">
                        <i class="fa-solid fa-users"></i>
                    </div>

                    <div>

                        <div class="stat-value">
                            0
                        </div>

                        <div class="stat-label">
                            Aktif Müşteri
                        </div>

                    </div>

                </div>

                <div class="stat-card orange">

                    <div class="stat-icon">
                        <i class="fa-solid fa-handshake"></i>
                    </div>

                    <div>

                        <div class="stat-value">
                            0
                        </div>

                        <div class="stat-label">
                            Eşleştirme
                        </div>

                    </div>

                </div>

                <div class="stat-card purple">

                    <div class="stat-icon">
                        <i class="fa-solid fa-tag"></i>
                    </div>

                    <div>

                        <div class="stat-value">
                            0
                        </div>

                        <div class="stat-label">
                            Satılık Portföy
                        </div>

                    </div>

                </div>

            </section>

            <!-- PAGE ACTIONS -->
            <div class="page-actions">

                <button
                    class="btn btn-primary"
                    onclick="openPortfolioModal()"
                >

                    <i class="fa-solid fa-plus"></i>

                    Yeni Portföy

                </button>

            </div>

            <!-- PORTFOLIO GRID -->
            <section
                class="portfolio-grid"
                id="portfolioGrid"
            >

            </section>

        </div>

    </main>

    <!-- MODAL -->
    <div class="modal-overlay" id="portfolioModal">

        <div class="modal large">

            <div class="modal-header">

                <h2>
                    <i class="fa-solid fa-building"></i>
                    Yeni Portföy
                </h2>

                <button
                    class="modal-close"
                    onclick="closePortfolioModal()"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <div class="modal-body">

                <form id="portfolioForm">

                    <div class="form-grid">

                        <div class="form-group">

                            <label>İlan Başlığı</label>

                            <input
                                type="text"
                                id="title"
                                placeholder="Örn: 3+1 Lüks Daire"
                            />

                        </div>

                        <div class="form-group">

                            <label>Fiyat</label>

                            <input
                                type="number"
                                id="price"
                                placeholder="7500000"
                            />

                        </div>

                        <div class="form-group full">

                            <label>Konum</label>

                            <input
                                type="text"
                                id="location"
                                placeholder="Çerkezköy / Tekirdağ"
                            />

                        </div>

                        <div class="form-group full">

                            <label>Açıklama</label>

                            <textarea
                                id="description"
                                placeholder="Portföy açıklaması..."
                            ></textarea>

                        </div>

                        <div class="form-group full">

                            <label>Fotoğraflar</label>

                            <input
                                type="file"
                                id="photoInput"
                                multiple
                                accept="image/*"
                            />

                            <div
                                class="photo-preview-grid"
                                id="photoPreview"
                            ></div>

                        </div>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    onclick="closePortfolioModal()"
                >
                    İptal
                </button>

                <button
                    class="btn btn-primary"
                    onclick="savePortfolio()"
                >
                    Kaydet
                </button>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script type="module" src="./js/portfolio.js"></script>

    <script>

        function openPortfolioModal() {

            document
                .getElementById("portfolioModal")
                .classList.add("active");
        }

        function closePortfolioModal() {

            document
                .getElementById("portfolioModal")
                .classList.remove("active");
        }

    </script>

</body>

</html>
```
